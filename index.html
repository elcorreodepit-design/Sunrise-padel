<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Sunrise Pádel 2.0</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box} body{margin:0}.app{min-height:100vh}.top{background:#111827;color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;font-size:22px}.sub{opacity:.7;font-size:12px}.nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;background:white;border-bottom:1px solid #e5e7eb}.nav button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#e5e7eb;cursor:pointer;font-weight:650}.nav button.active,.btn.primary{background:#111827;color:white}.wrap{max-width:1200px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 2px 8px #00000008}.kpi{font-size:30px;font-weight:800;margin-top:6px}.muted{color:#6b7280;font-size:13px}.section{margin-top:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:700}.danger{color:#b91c1c}.ok{color:#047857}.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.item{padding:12px;border:1px solid #e5e7eb;border-radius:10px;display:flex;justify-content:space-between;gap:10px}.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.court{border:2px solid #e5e7eb;border-radius:14px;padding:14px}.court h3{margin:0 0 10px}.players{display:grid;gap:6px}.player{background:#f9fafb;padding:8px;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:28px;text-align:center;color:#6b7280}input,select{padding:10px;border:1px solid #d1d5db;border-radius:9px;width:100%;max-width:320px}.form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.form label{font-size:12px;color:#6b7280;display:grid;gap:5px}.small{font-size:12px}
  </style>
</head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState}=React;
const COURT_ORDER=[12,9,6,3,2,5,8,11,10,7,4,1];
const seedPlayers=[
 {id:1,name:'Firas Sakka',level:3.4,wins:0,plays:0,bonus7:0,bonus10:0,bonus15:0,free:0},
 {id:2,name:'Luis Comino',level:3.3,wins:0,plays:0,bonus7:0,bonus10:0,bonus15:0,free:0},
 {id:3,name:'Manu Rapariz',level:3.1,wins:0,plays:0,bonus7:0,bonus10:0,bonus15:0,free:0},
 {id:4,name:'Jugador Sunrise',level:2.8,wins:0,plays:0,bonus7:0,bonus10:0,bonus15:0,free:0}
];
function App(){
 const [view,setView]=useState('dashboard');
 const [players,setPlayers]=useState(seedPlayers);
 const [date,setDate]=useState('2026-09-06');
 const [confirmed,setConfirmed]=useState([]);
 const [courts,setCourts]=useState([]);
 const [results,setResults]=useState({});
 const [pool,setPool]=useState('pre');
 const [newName,setNewName]=useState('');
 const [newLevel,setNewLevel]=useState(3);
 const addPlayer=()=>{if(!newName.trim())return;setPlayers(p=>[...p,{id:Date.now(),name:newName.trim(),level:+newLevel,wins:0,plays:0,bonus7:0,bonus10:0,bonus15:0,free:0}]);setNewName('')};
 const toggle=id=>setConfirmed(x=>x.includes(id)?x.filter(i=>i!==id):[...x,id]);
 const generate=()=>{const ps=players.filter(p=>confirmed.includes(p.id)).sort((a,b)=>b.level-a.level);const n=Math.ceil(ps.length/4);const cs=Array.from({length:n},(_,i)=>({number:COURT_ORDER[i],players:[]}));ps.forEach((p,i)=>cs[i%n].players.push(p));setCourts(cs);setPool('live');setView('sunday')};
 const setResult=(id,finalCourt,outcome)=>setResults(r=>({...r,[id]:{finalCourt:+finalCourt,outcome}}));
 const closePool=()=>{setPlayers(ps=>ps.map(p=>{if(!confirmed.includes(p.id))return p;const r=results[p.id];if(!r)return p;const start=courts.find(c=>c.players.some(x=>x.id===p.id))?.number;const si=COURT_ORDER.indexOf(start),fi=COURT_ORDER.indexOf(r.finalCourt);let delta=0;if(si>=0&&fi>=0)delta=(si-fi)*.1;const outcome=r.outcome==='win'?.1:r.outcome==='loss'?-0.1:-0.1;return {...p,level:Math.max(1,+(p.level+delta+outcome).toFixed(2)),wins:p.wins+(r.outcome==='win'?1:0),plays:p.plays+1}}));setPool('closed');setView('dashboard')};
 return <div className="app"><header className="top"><div><div className="brand">☀️ SUNRISE PÁDEL 2.0</div><div className="sub">Gestión de pozos · ranking · niveles · bonos · contabilidad</div></div><span className="pill">V1</span></header>
 <nav className="nav">{[['dashboard','Inicio'],['sunday','Domingo'],['players','Jugadores'],['ranking','Ranking'],['bonuses','Bonos'],['accounting','Contabilidad'],['settings','Configuración']].map(([k,t])=><button className={view===k?'active':''} onClick={()=>setView(k)}>{t}</button>)}</nav>
 <main className="wrap">
 {view==='dashboard'&&<Dashboard players={players} date={date} setDate={setDate} confirmed={confirmed} courts={courts}/>} 
 {view==='sunday'&&<Sunday players={players} confirmed={confirmed} toggle={toggle} courts={courts} generate={generate} results={results} setResult={setResult} closePool={closePool} date={date} pool={pool}/>} 
 {view==='players'&&<Players players={players} newName={newName} setNewName={setNewName} newLevel={newLevel} setNewLevel={setNewLevel} addPlayer={addPlayer}/>} 
 {view==='ranking'&&<Ranking players={players}/>} 
 {view==='bonuses'&&<Bonuses players={players}/>} 
 {view==='accounting'&&<Accounting/>} 
 {view==='settings'&&<Settings/>}
 </main></div>
}
function Dashboard({players,date,setDate,confirmed,courts}){return <><div className="row"><div><h1>Panel de control</h1><div className="muted">Próximo domingo: {date}</div></div><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div><div className="grid section"><div className="card"><div className="muted">Jugadores</div><div className="kpi">{players.length}</div></div><div className="card"><div className="muted">Confirmados</div><div className="kpi">{confirmed.length}</div></div><div className="card"><div className="muted">Pistas calculadas</div><div className="kpi">{courts.length||0}</div></div><div className="card"><div className="muted">Precio pozo</div><div className="kpi">15 €</div></div></div><div className="card section"><b>Flujo del domingo</b><p className="muted">Inscripciones → Confirmar asistentes → Generar pistas → Resultados → Cerrar pozo → actualizar nivel y ranking.</p></div></>}
function Sunday({players,confirmed,toggle,courts,generate,results,setResult,closePool,date,pool}){return <><div className="row"><div><h1>Domingo · {date}</h1><div className="muted">Estado: {pool}</div></div><div className="toolbar"><button className="btn primary" onClick={generate}>Generar pistas</button>{pool==='live'&&<button className="btn" onClick={closePool}>Cerrar pozo</button>}</div></div><div className="card section"><b>Asistentes ({confirmed.length})</b><div className="list">{players.map(p=><label className="item"><span><input style={{width:'auto'}} type="checkbox" checked={confirmed.includes(p.id)} onChange={()=>toggle(p.id)}/> {p.name} <span className="muted">nivel {p.level.toFixed(2)}</span></span><span className="pill">{confirmed.includes(p.id)?'CONFIRMADO':'INSCRITO'}</span></label>)}</div></div>{courts.length>0&&<div className="section"><div className="row"><h2>Pistas</h2><span className="muted">4 jugadores por pista · orden configurable</span></div><div className="courts">{courts.map(c=><div className="court"><h3>Pista {c.number}</h3><div className="players">{c.players.map(p=><div className="player"><b>{p.name}</b><div className="small">Inicio · nivel {p.level.toFixed(2)}</div><select value={results[p.id]?.finalCourt||c.number} onChange={e=>setResult(p.id,e.target.value,results[p.id]?.outcome||'')}><option value={c.number}>Último partido: pista {c.number}</option>{COURT_ORDER.map(x=><option value={x}>Último partido: pista {x}</option>)}</select><select value={results[p.id]?.outcome||''} onChange={e=>setResult(p.id,results[p.id]?.finalCourt||c.number,e.target.value)}><option value="">Resultado...</option><option value="win">Ganó</option><option value="loss">Perdió</option><option value="invalid">No validado</option></select></div>)}</div></div>)}</div><div className="card section"><b>Regla de nivel</b><p className="muted">Diferencia entre pista inicial y pista final según el orden configurado, ±0,10 por posición. Victoria +0,10. Derrota −0,10. Resultado no validado −0,10.</p></div></div>}</>}
function Players({players,newName,setNewName,newLevel,setNewLevel,addPlayer}){return <><div className="row"><h1>Jugadores</h1><span className="muted">Base de datos Sunrise</span></div><div className="card"><div className="form"><label>Nombre<input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Nombre y apellidos"/></label><label>Nivel inicial<input type="number" step="0.1" value={newLevel} onChange={e=>setNewLevel(e.target.value)}/></label><button className="btn primary" onClick={addPlayer}>+ Añadir</button></div></div><div className="list section">{players.map(p=><div className="item"><div><b>{p.name}</b><div className="muted">Nivel Sunrise {p.level.toFixed(2)} · {p.plays} participaciones · {p.wins} victorias</div></div><span className="pill">Bonos: {(p.bonus7||0)+(p.bonus10||0)+(p.bonus15||0)}</span></div>)}</div></>}
function Ranking({players}){const sorted=[...players].sort((a,b)=>b.wins-a.wins||b.plays-a.plays);return <><h1>Ranking</h1><div className="card"><p className="muted">V1: se preparará el cálculo completo de los 8 mejores resultados por trimestre. Desempate: victorias y participaciones.</p>{sorted.map((p,i)=><div className="item"><b>#{i+1} · {p.name}</b><span>{p.wins} victorias · {p.plays} participaciones</span></div>)}</div></>}
function Bonuses({players}){return <><h1>Bonos</h1><div className="grid"><div className="card"><b>Bono 7</b><div className="kpi">100 €</div><div className="muted">7 participaciones</div></div><div className="card"><b>Bono 10</b><div className="kpi">140 €</div><div className="muted">10 participaciones</div></div><div className="card"><b>Bono 15</b><div className="kpi">200 €</div><div className="muted">15 participaciones</div></div></div><div className="card section"><b>Regla</b><p className="muted">Los bonos son independientes, no caducan y consumir una participación no crea un nuevo ingreso.</p></div></>}
function Accounting(){return <><h1>Contabilidad</h1><div className="grid"><div className="card"><div className="muted">Pozo normal</div><div className="kpi">15 €</div></div><div className="card"><div className="muted">Bonos</div><div className="kpi">100/140/200 €</div></div><div className="card"><div className="muted">Gastos</div><div className="kpi">—</div></div><div className="card"><div className="muted">Beneficio</div><div className="kpi">—</div></div></div><div className="card section"><p className="muted">El modelo definitivo registrará ingresos por pagos/compra de bonos y gastos del pozo, sin caja física.</p></div></>}
function Settings(){return <><h1>Configuración</h1><div className="card"><h3>Orden de pistas</h3><div className="pill">12 → 9 → 6 → 3 → 2 → 5 → 8 → 11 → 10 → 7 → 4 → 1</div><p className="muted">Editable por administrador. La generación automática intentará mezclar género y mantener la variación de nivel dentro de ±0,4.</p></div><div className="card section"><h3>Reglas</h3><div className="list"><div className="item">Precio pozo <b>15 €</b></div><div className="item">Jugadores por pista <b>4</b></div><div className="item">Ranking trimestral <b>8 mejores resultados</b></div></div></div></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
